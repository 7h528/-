<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园活动聚合站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>校园活动聚合站</h1>
    <p>发现精彩校园活动，不错过每一场</p>
  </header>

  <main>
    <!-- 筛选区域 -->
    <section class="filter-bar">
      <label for="category-filter">分类筛选：</label>
      <select id="category-filter">
        <option value="all">全部</option>
        <option value="学术">学术</option>
        <option value="体育">体育</option>
        <option value="文艺">文艺</option>
        <option value="社团">社团</option>
        <option value="志愿">志愿</option>
        <option value="就业">就业</option>
      </select>
      <label for="status-filter">状态筛选：</label>
      <select id="status-filter">
        <option value="all">全部</option>
        <option value="upcoming">即将开始</option>
        <option value="expired">已过期</option>
      </select>
    </section>

    <!-- 活动列表 -->
    <section id="activity-list" class="activity-list">
      <!-- JS 动态渲染 -->
    </section>

    <!-- 发布表单 -->
    <section class="publish-form">
      <h2>发布新活动</h2>
      <form id="new-activity-form">
        <input type="text" id="act-title" placeholder="活动名称" required>
        <select id="act-category" required>
          <option value="">选择分类</option>
          <option value="学术">学术</option>
          <option value="体育">体育</option>
          <option value="文艺">文艺</option>
          <option value="社团">社团</option>
          <option value="志愿">志愿</option>
          <option value="就业">就业</option>
        </select>
        <input type="text" id="act-location" placeholder="活动地点" required>
        <input type="datetime-local" id="act-time" required>
        <textarea id="act-desc" placeholder="活动简介" rows="3"></textarea>
        <button type="submit">发布活动</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 校园活动聚合站</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
